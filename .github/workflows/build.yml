# .github/workflows/ci.yml
name: CI – Docker Compose Test

on:
  push:
    branches: [ main, master, mlops ]
  pull_request:
  workflow_dispatch:

jobs:
  test-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # нужно для --build

      - name: Validate compose file
        run: docker compose config

      - name: Create your exact networks
        run: |
          docker network create monitoring_net 2>/dev/null || true
          docker network create searxng        2>/dev/null || true

      - name: Start all services
        run: docker compose up -d --build --force-recreate

      - name: Wait for healthy services (max 90 sec)
        run: |
          timeout 90 bash -c '
            until docker compose ps | grep "(healthy)" >/dev/null; do
              echo "Waiting for healthy containers..."
              sleep 5
            done
            echo "All healthy services are up!"
          ' || {
            echo "Timeout or unhealthy services!"
            docker compose ps
            docker compose logs --tail=100
            exit 1
          }

      - name: Check backend is responding
        run: |
          sleep 8
          curl -f http://localhost:13000/health && echo "Backend OK" || {
            echo "Backend not responding!"
            docker logs ai_gift_assistant_backend --tail=100
            exit 1
          }

      - name: Final status
        if: always()
        run: docker compose ps

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans --rmi local
          docker network prune -f